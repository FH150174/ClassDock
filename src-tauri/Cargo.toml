[package]
name = "classdock"
version = "0.3.1"
description = "Windows 桌面课程表 Widget"
edition = "2021"
rust-version = "1.90"

[lib]
name = "classdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
