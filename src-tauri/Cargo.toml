[package]
name = "classdock"
version = "0.2.0"
description = "Windows 桌面课程表 Widget"
edition = "2021"
rust-version = "1.90"

[lib]
name = "classdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
